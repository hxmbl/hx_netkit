name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Release - ${{ matrix.platform.os-name }}
    strategy:
      matrix:
        platform:
          - os-name: Linux-x86_64
            runs-on: ubuntu-24.04
            target: x86_64-unknown-linux-musl

          - os-name: Linux-aarch64
            runs-on: ubuntu-24.04
            target: aarch64-unknown-linux-musl

          - os-name: macOS-x86_64
            runs-on: macos-latest
            target: x86_64-apple-darwin

          - os-name: macOS-aarch64
            runs-on: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          args: "--release --manifest-path tools/correlator/Cargo.toml"

      - name: Find binary
        id: find
        run: |
          BIN=$(find . -path "*/target/${{ matrix.platform.target }}/release/correlator" -type f | head -1)
          if [ -z "$BIN" ]; then
            BIN=$(find . -path "*/target/release/correlator" -type f | head -1)
          fi
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"
          echo "Found binary: $BIN"

      - name: Package
        run: |
          BIN="${{ steps.find.outputs.bin }}"
          TAG="${GITHUB_REF#refs/tags/}"
          ARCHIVE="correlator-${TAG}-${{ matrix.platform.target }}.tar.gz"
          tar czf "$ARCHIVE" -C "$(dirname "$BIN")" correlator
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
