name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Release - ${{ matrix.goos }}-${{ matrix.goarch }}
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runs-on: ubuntu-24.04
            goos: linux
            goarch: arm64
          - runs-on: macos-latest
            goos: darwin
            goarch: amd64
          - runs-on: macos-latest
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags "-s -w" -o correlator ./cmd/correlator

      - name: Package
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ARCHIVE="correlator-${TAG}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar czf "$ARCHIVE" correlator README.md Changes.md
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
