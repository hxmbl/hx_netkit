name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Release - ${{ matrix.goos }}-${{ matrix.goarch }}
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runs-on: ubuntu-24.04
            goos: linux
            goarch: arm64
          - runs-on: macos-latest
            goos: darwin
            goarch: amd64
          - runs-on: macos-latest
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags "-s -w" -o correlator ./cmd/correlator

      - name: Package
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ARCHIVE="correlator-${TAG}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar czf "$ARCHIVE" correlator README.md Changes.md
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}

  homebrew:
    name: Update Homebrew tap
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" \
            --pattern 'correlator-*-*.tar.gz' --dir dist --clobber
          ls -la dist

      - name: Generate formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go run ./internal/devtools/formulagen -version "$VERSION" -dist ./dist -out Formula/correlator.rb

      # Pushes with a repo-scoped SSH deploy key (write access on
      # hxmbl/homebrew-tap only) — never a personal access token.
      #
      # One-time setup:
      #   ssh-keygen -t ed25519 -C "correlator-tap-deploy" -f tap_deploy_key -N ""
      #   → add tap_deploy_key.pub as a Deploy key (write) on homebrew-tap
      #   → `gh secret set TAP_DEPLOY_KEY < tap_deploy_key` in this repo
      - name: Push to tap (needs secret TAP_DEPLOY_KEY)
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::warning::Secret TAP_DEPLOY_KEY not set — skipping tap update."
            echo "One-time setup (repo-scoped deploy key, no PAT):"
            echo "  ssh-keygen -t ed25519 -C correlator-tap-deploy -f tap_deploy_key -N ''"
            echo "  add tap_deploy_key.pub as a WRITE deploy key on hxmbl/homebrew-tap"
            echo "  gh secret set TAP_DEPLOY_KEY < tap_deploy_key   (in hx_netkit)"
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_deploy_key
          chmod 600 ~/.ssh/tap_deploy_key
          cat >> ~/.ssh/config <<'SSH'
          Host github.com
            IdentityFile ~/.ssh/tap_deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          SSH

          git clone git@github.com:hxmbl/homebrew-tap.git tap
          cp Formula/correlator.rb tap/correlator.rb
          cd tap
          git config user.name  "correlator-bot"
          git config user.email "bot@users.noreply.github.com"
          git add correlator.rb
          git commit -m "correlator ${TAG}" || { echo "formula unchanged — nothing to push"; exit 0; }
          git push origin HEAD:main
